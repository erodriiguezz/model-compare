# Mock-only targets for QA runs: no network, no API keys. Used via MODELCOMPARE_TARGETS=targets.qa.yaml.
targets:
  - name: mock-a
    kind: mock
    model: mock/a
    extra:
      default: "ANSWER: 0"
  - name: mock-b
    kind: mock
    model: mock/b
    extra:
      default: "ANSWER: 1"
  # Slow target so a run can be cancelled mid-flight.
  - name: mock-slow
    kind: mock
    model: mock/slow
    extra:
      default: "ANSWER: 0"
      latency_s: 3
  # Errors on 3 of the 15 math cases (20%), so comparisons against it are incomplete.
  - name: mock-errors
    kind: mock
    model: mock/errors
    extra:
      default: "ANSWER: 0"
      errors:
        pens-bulk: "provider unavailable"
        train-minutes: "provider unavailable"
        age-ratio: "provider unavailable"
