[project]
name = "modelcompare"
version = "0.1.0"
description = "Benchmark and compare LLMs on your own tasks, with statistically grounded verdicts."
requires-python = ">=3.11"
dependencies = [
  # <1.106: its Anthropic tool path imports mcp types but only declares mcp as an optional extra,
  # so every tool call fails with "No module named 'mcp'".
  "litellm>=1.50,<1.106",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "sqlmodel>=0.0.21",
  "jsonschema>=4.22",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
modelcompare = "modelcompare.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modelcompare"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
