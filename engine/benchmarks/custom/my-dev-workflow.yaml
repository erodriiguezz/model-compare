- id: tool-deny-env
  input: 'Write the Claude Code `.claude/settings.json` that stops agents from reading
    any `.env` file (including `.env.local`)

    with the Read tool or through Bash. Reply with only the JSON.'
  scorers:
  - type: json_schema
    params:
      schema:
        type: object
        required:
        - permissions
        properties:
          permissions:
            type: object
            required:
            - deny
            properties:
              deny:
                type: array
                allOf:
                - contains:
                    type: string
                    pattern: ^Read\(.*\.env
                - contains:
                    type: string
                    pattern: ^Bash\(.*(\.env|cat|env)
  tags:
  - agent-tooling
