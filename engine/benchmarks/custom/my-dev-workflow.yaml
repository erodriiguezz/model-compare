name: my-dev-workflow
dimension: custom
repeats: 1
pass_threshold: 0.8
version: '2'
description: 'v2 — 80 cases weighted by what I actually use Claude for (~1,500 prompts
  across 250 sessions): shipping 12, debugging 12, agent tooling 12, planning 12,
  UI polish 8, client content edits 4, infra/CI 6, concise summaries 6, tech-lead
  PR review 6, data parsing 2. Harder than v1 (v1''s shipping and debugging cases
  didn''t separate models); reviews ask for the top N issues so thoroughness isn''t
  penalised. All cases are synthetic.'
system_prompt: 'You are a senior software engineer pairing with a developer.

  Style: lead with the answer in the first sentence. Be concise and direct; length
  is a cost.

  Push back plainly when a request rests on a wrong assumption. No preambles, no filler,
  no closing pleasantries.

  Conventions: branches are <type>/<short-description> (types feat, bugfix, hotfix,
  chore, refactor; kebab-case, 3-5 words).

  Commit subjects and PR titles are "type: description" (types feat, fix, chore, refactor,
  docs, style, test, perf, ci, build),

  lowercase, imperative mood, at most 72 characters, no trailing period, no scope
  in parentheses.

  Never add AI attribution (no Co-Authored-By, no "Generated with" lines).'
scorers:
- type: contains
cases:
- id: ship-commit-null-profile
  input: 'Write the commit subject for this change. Reply with only the subject line.


    -    return user.profile.display_name

    +    if user.profile is None:

    +        return user.email.split("@")[0]

    +    return user.profile.display_name

    Context: new sign-ups crashed with AttributeError on first login because profiles
    are created lazily.'
  scorers:
  - type: regex
    params:
      pattern: '\A\s*(?=[^\n]{1,72}\s*\Z)fix: [a-z][^\n]*[^.\s]\s*\Z'
  tags:
  - shipping
- id: ship-branch-prod-checkout
  input: 'Production checkout has returned 500s for 20 minutes because a null coupon
    crashes the total. I''m patching and

    deploying immediately. Give me only the branch name.'
  scorers:
  - type: regex
    params:
      pattern: \A\s*`?hotfix/[a-z0-9]+(-[a-z0-9]+){2,4}`?\s*\Z
  tags:
  - shipping
- id: ship-branch-deps
  input: Bumping axios, vitest and eslint to their latest minor versions, no code
    changes. Give me only the branch name.
  scorers:
  - type: regex
    params:
      pattern: \A\s*`?chore/[a-z0-9]+(-[a-z0-9]+){2,4}`?\s*\Z
  tags:
  - shipping
- id: ship-pr-title-multiday
  input: 'Give me only the PR title: events can now span several days. The model swaps
