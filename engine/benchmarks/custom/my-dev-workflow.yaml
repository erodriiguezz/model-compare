    \ = f\"product:{pid}\"\n    if (hit := cache.get(key)) is not None:\n        return\
    \ hit\n    p = db.load_product(pid); cache.set(key, p, ttl=3600); return p\n\n\
    def update_price(pid, price):\n    db.update_price(pid, price)\n    cache.delete(f\"\
    product-{pid}\")\n```"
