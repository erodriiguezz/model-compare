  scorers:
  - type: regex
    params:
      pattern: \A\s*[^\n]+\n[^\n]+\s*\Z
  - type: regex
    params:
      pattern: '(?m)^(chore|build): [a-z][^\n]{0,64}[^.\s]$'
  - type: regex
    params:
      pattern: '(?m)^fix: [a-z][^\n]{0,66}[^.\s]$'
  tags:
  - shipping
- id: ship-pr-body
  input: 'Write the PR description for: rate limiting on the public API (60/min free,
    600/min paid, Redis sliding window,

    429 with Retry-After). Use sections "## Summary", "## Changes", "## Testing",
    "## Notes / Risks". The first line must

    be "Closes #42". Keep it under 180 words.'
  scorers:
  - type: instructions
    params:
      checks:
      - type: starts_with
        value: 'Closes #42'
      - type: contains
        value: '## Summary'
      - type: contains
        value: '## Changes'
      - type: contains
        value: '## Testing'
      - type: contains
        value: '## Notes / Risks'
      - type: max_words
        value: 180
      - type: not_contains
        value: generated with
      - type: not_contains
        value: co-authored
