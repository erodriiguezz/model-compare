- id: plan-multiday-events
  input: 'Plan this change before any code. Community events site (Next.js + Postgres).
    Today an event has `date` and `time`.

    We need multi-day events: start and end date/time, "past events" should use the
    end, and cards show a range.

    ~400 existing events; a nightly sync imports events from Meetup and Luma.

    Sections: Approach, Blast radius, Acceptance criteria, Risks. Under 300 words.'
  scorers:
  - type: instructions
    params:
      checks:
      - type: contains
        value: Blast radius
      - type: contains
        value: Acceptance criteria
      - type: contains
        value: Risk
      - type: max_words
        value: 300
  - type: contains
    params:
      values:
      - - backfill
        - migrate existing
        - migration
      - - sync
        - import
      - - end_at
        - end time
        - end date
      - - timezone
        - time zone
        - UTC
  - type: llm_judge
    params:
      rubric: Migrates existing events (backfill end from start), updates the sync
        importers, defines 'past' by end time, handles timezones, testable acceptance
        criteria. Penalise vague or padded plans.
  tags:
  - planning
