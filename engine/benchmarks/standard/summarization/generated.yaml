    ---
    Postmortem: notification queue outage.
    On the evening of the incident the notification queue returned errors for 202 minutes. Roughly 3433 customers were affected. The root cause was a full disk on the primary node. The issue was first noticed by a customer report rather than by monitoring, which delayed the response by about 20 minutes. Some discussion followed about naming conventions, but no decision was needed. Questions from the sales team were collected and will be answered separately. Engineers restored service by rolling back and restarting the affected nodes. Follow-up: Jonas Weber will require review for config pushes by the end of the quarter. It was agreed that the meeting notes would be shared in the usual channel.
