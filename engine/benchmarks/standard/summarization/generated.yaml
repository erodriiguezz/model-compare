- id: incident-48
  input: |-
    Summarise the document below for an executive in exactly 3 bullet points, each starting with "- ", using at most 59 words in total. Keep the facts that matter most (causes, numbers, decisions, owners). Do not use bold or headings, and do not introduce any number that is not in the document.

    ---
    Postmortem: login service outage.
    On the evening of the incident the login service returned errors for 140 minutes. Roughly 8645 customers were affected. The root cause was a bad configuration push. The issue was first noticed by a customer report rather than by monitoring, which delayed the response by about 20 minutes. The group briefly revisited last month's discussion about tooling, without new conclusions. Some discussion followed about naming conventions, but no decision was needed. Engineers restored service by rolling back and restarting the affected nodes. Follow-up: Marta Silva will add expiry alerts by the end of the quarter. Several people joined the call late because the bridge link in the calendar invite was outdated.
  tags:
  - incident
  vars:
    must_include:
    - - configuration
    - - '8645'
      - 8,645
    - - '140'
    - - Marta
      - Marta Silva
    checks:
    - type: max_words
      value: 59
    - type: bullet_count
      value: 3
    - type: no_markdown
    source: |-
      Postmortem: login service outage.
      On the evening of the incident the login service returned errors for 140 minutes. Roughly 8645 customers were affected. The root cause was a bad configuration push. The issue was first noticed by a customer report rather than by monitoring, which delayed the response by about 20 minutes. The group briefly revisited last month's discussion about tooling, without new conclusions. Some discussion followed about naming conventions, but no decision was needed. Engineers restored service by rolling back and restarting the affected nodes. Follow-up: Marta Silva will add expiry alerts by the end of the quarter. Several people joined the call late because the bridge link in the calendar invite was outdated.
    reference: |-
      - The login service failed for 140 minutes because of a bad configuration push.
      - About 8645 customers were affected and a customer report caught it before monitoring did.
      - Marta Silva will add expiry alerts by the end of the quarter.
