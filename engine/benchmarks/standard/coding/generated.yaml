- id: histogram
  input: 'Write `histogram(values: list[float], bins: int, lo: float, hi: float) -> list[int]` counting values into `bins` equal-width bins covering [lo, hi]. Each bin is half-open [a, b) except the last, which also includes hi. Values outside [lo, hi] are ignored. Raise ValueError if bins < 1 or hi <= lo.'
  tags:
  - coding
  vars:
    tests: |-
      assert histogram([0, 1, 2, 3, 4, 5], 5, 0, 5) == [1, 1, 1, 1, 2]
      assert histogram([-1, 0.5, 9.99, 10, 10.01], 2, 0, 10) == [1, 2]
      assert histogram([], 3, 0, 1) == [0, 0, 0]
      assert histogram([0.1, 0.2, 0.3], 1, 0, 1) == [3]
      for args in ((0, 0, 1), (2, 1, 1), (2, 2, 1)):
          try:
              histogram([1], *args)
          except ValueError:
              pass
          else:
              raise AssertionError(args)
    reference: |-
      ```python
      def histogram(values, bins, lo, hi):
          if bins < 1 or hi <= lo:
              raise ValueError("bad range")
          counts = [0] * bins
          width = (hi - lo) / bins
          for v in values:
              if v < lo or v > hi:
                  continue
              i = bins - 1 if v == hi else min(int((v - lo) / width), bins - 1)
              counts[i] += 1
          return counts
      ```
