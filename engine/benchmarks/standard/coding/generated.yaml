    reference: |-
      ```python
      MINOR = {"a", "an", "the", "and", "but", "or", "of", "in", "on", "at", "to", "for"}
      def title_case(s):
          words = s.split(" ")
          out = []
          for i, w in enumerate(words):
              edge = i == 0 or i == len(words) - 1
              parts = w.lower().split("-")
              cap = []
              for j, p in enumerate(parts):
                  minor = p in MINOR and not (edge and len(parts) == 1) and not (j == 0 and i == 0)
                  cap.append(p if minor else p[:1].upper() + p[1:])
              out.append("-".join(cap))
          return " ".join(out)
      ```
- id: insert-position
  input: 'Write `insert_position(nums: list[int], target: int) -> int`: the leftmost index where target could be inserted into the sorted list nums keeping it sorted, in O(log n), without using the bisect module.'
  tags:
  - coding
  vars:
    tests: |-
      assert insert_position([1, 3, 5, 6], 5) == 2
      assert insert_position([1, 3, 5, 6], 2) == 1
      assert insert_position([1, 3, 5, 6], 7) == 4
      assert insert_position([1, 3, 5, 6], 0) == 0
      assert insert_position([], 3) == 0
      assert insert_position([2, 2, 2, 3], 2) == 0
    reference: |-
      ```python
      def insert_position(nums, target):
          lo, hi = 0, len(nums)
          while lo < hi:
              mid = (lo + hi) // 2
              if nums[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid
          return lo
      ```
- id: two-trades
  input: 'Write `max_profit_two(prices: list[int]) -> int`: the maximum profit from at most two buy-then-sell trades that do not overlap (you must sell before buying again). Return 0 if no profit is possible. O(n).'
  tags:
  - coding
  vars:
    tests: |-
      assert max_profit_two([3, 3, 5, 0, 0, 3, 1, 4]) == 6
      assert max_profit_two([1, 2, 3, 4, 5]) == 4
      assert max_profit_two([7, 6, 4, 3, 1]) == 0
      assert max_profit_two([1, 2, 4, 2, 5, 7, 2, 4, 9, 0]) == 13
      assert max_profit_two([]) == 0
    reference: |-
      ```python
      def max_profit_two(prices):
          b1 = b2 = float("-inf")
          s1 = s2 = 0
          for p in prices:
              b1 = max(b1, -p)
              s1 = max(s1, b1 + p)
              b2 = max(b2, s1 - p)
              s2 = max(s2, b2 + p)
          return s2
      ```
- id: coin-ways
  input: 'Write `coin_ways(amount: int, coins: list[int]) -> int`: the number of distinct combinations (order does not matter) of coins summing to amount, with unlimited coins of each value. coin_ways(0, ...) is 1. Duplicate coin values count once.'
  tags:
  - coding
  vars:
    tests: |-
      assert coin_ways(5, [1, 2, 5]) == 4
      assert coin_ways(3, [2]) == 0
      assert coin_ways(0, [7]) == 1
      assert coin_ways(10, [10]) == 1
      assert coin_ways(5, [1, 1, 2, 5]) == 4
      assert coin_ways(500, [1, 2, 5, 10, 20, 50, 100, 200]) == 6295434
    reference: |-
      ```python
      def coin_ways(amount, coins):
          ways = [1] + [0] * amount
          for c in sorted(set(coins)):
              for a in range(c, amount + 1):
                  ways[a] += ways[a - c]
          return ways[amount]
      ```
- id: min-coins
  input: 'Write `min_coins(amount: int, coins: list[int]) -> int`: the fewest coins summing to amount with unlimited coins of each value, or -1 if impossible. min_coins(0, ...) is 0. Greedy is not always correct (e.g. coins [1, 3, 4] for 6 needs 2).'
  tags:
  - coding
  vars:
    tests: |-
      assert min_coins(11, [1, 2, 5]) == 3
      assert min_coins(3, [2]) == -1
      assert min_coins(0, [1]) == 0
      assert min_coins(6, [1, 3, 4]) == 2
      assert min_coins(7, [2, 4]) == -1
      assert min_coins(10000, [7, 13, 29]) == 348
    reference: |-
      ```python
      def min_coins(amount, coins):
          INF = float("inf")
          best = [0] + [INF] * amount
          for a in range(1, amount + 1):
              for c in coins:
                  if c <= a and best[a - c] + 1 < best[a]:
                      best[a] = best[a - c] + 1
          return -1 if best[amount] == INF else best[amount]
      ```
- id: lis
  input: 'Write `lis_length(nums: list[int]) -> int`: the length of the longest strictly increasing subsequence, in O(n log n) (it must handle 100,000 numbers quickly).'
  tags:
  - coding
  vars:
    tests: |-
      assert lis_length([10, 9, 2, 5, 3, 7, 101, 18]) == 4
      assert lis_length([0, 1, 0, 3, 2, 3]) == 4
      assert lis_length([7, 7, 7]) == 1
      assert lis_length([]) == 0
      import time
      t = time.time()
      assert lis_length(list(range(100000))) == 100000
      assert time.time() - t < 3
    reference: |-
      ```python
      import bisect
      def lis_length(nums):
          tails = []
          for x in nums:
              i = bisect.bisect_left(tails, x)
              if i == len(tails):
                  tails.append(x)
              else:
                  tails[i] = x
          return len(tails)
      ```
- id: trie
  input: Write a class `Trie` with `insert(word)`, `contains(word) -> bool` (exact word previously inserted), `starts_with(prefix) -> bool` and `count_prefix(prefix) -> int` (number of distinct inserted words with that prefix; inserting the same word twice counts once). The empty prefix matches every word.
  tags:
  - coding
  vars:
    tests: |-
      t = Trie()
      for w in ["apple", "app", "apply", "ape", "app"]:
          t.insert(w)
      assert t.contains("app") and not t.contains("ap")
      assert t.starts_with("ap") and not t.starts_with("b")
      assert t.count_prefix("app") == 3
      assert t.count_prefix("") == 4
      assert t.count_prefix("apples") == 0
    reference: |-
      ```python
      class Trie:
          def __init__(self):
              self.root = {}
              self.words = set()
          def insert(self, word):
              if word in self.words:
                  return
              self.words.add(word)
              node = self.root
              for ch in word:
                  node = node.setdefault(ch, {"#n": 0})
                  node["#n"] += 1
          def _node(self, prefix):
              node = self.root
              for ch in prefix:
                  if ch not in node:
                      return None
                  node = node[ch]
              return node
          def contains(self, word):
              return word in self.words
          def starts_with(self, prefix):
              return self._node(prefix) is not None
          def count_prefix(self, prefix):
              if prefix == "":
                  return len(self.words)
              node = self._node(prefix)
              return node["#n"] if node else 0
      ```
- id: interval-intersection
  input: 'Write `intersect(a: list[list[int]], b: list[list[int]]) -> list[list[int]]` where a and b are each sorted, disjoint lists of closed intervals; return their intersection as a sorted list of closed intervals (single points like [5, 5] included).'
  tags:
  - coding
  vars:
    tests: |-
      assert intersect([[0, 2], [5, 10], [13, 23], [24, 25]], [[1, 5], [8, 12], [15, 24], [25, 26]]) == [[1, 2], [5, 5], [8, 10], [15, 23], [24, 24], [25, 25]]
      assert intersect([], [[1, 2]]) == []
      assert intersect([[1, 7]], [[3, 10]]) == [[3, 7]]
      assert intersect([[1, 2]], [[3, 4]]) == []
    reference: |-
      ```python
      def intersect(a, b):
          i = j = 0
          out = []
          while i < len(a) and j < len(b):
              lo, hi = max(a[i][0], b[j][0]), min(a[i][1], b[j][1])
              if lo <= hi:
                  out.append([lo, hi])
              if a[i][1] < b[j][1]:
                  i += 1
              else:
                  j += 1
          return out
      ```
- id: sudoku-valid
  input: 'Write `valid_sudoku(board: list[str]) -> bool` for a partially filled 9x9 board given as 9 strings of digits and ''.''. Return True if no row, column or 3x3 box repeats a digit (the board need not be solvable). Return False for wrong dimensions or invalid characters.'
  tags:
  - coding
  vars:
    tests: |-
      ok = ["53..7....", "6..195...", ".98....6.", "8...6...3", "4..8.3..1", "7...2...6", ".6....28.", "...419..5", "....8..79"]
      assert valid_sudoku(ok)
      bad_box = ok[:]
      bad_box[1] = "6.5195..."
      assert not valid_sudoku(bad_box)
      bad_col = ok[:]
      bad_col[8] = "5...8..79"
      assert not valid_sudoku(bad_col)
      assert not valid_sudoku(ok[:8])
      assert not valid_sudoku(ok[:8] + ["....8..7x"])
      assert not valid_sudoku(ok[:8] + ["....8..790"])
      assert valid_sudoku(["........."] * 9)
    reference: |-
      ```python
      def valid_sudoku(board):
          if len(board) != 9 or any(len(r) != 9 or any(c not in "123456789." for c in r) for r in board):
              return False
          seen = set()
          for r in range(9):
              for c in range(9):
                  v = board[r][c]
                  if v == ".":
                      continue
                  keys = (("r", r, v), ("c", c, v), ("b", r // 3, c // 3, v))
                  if any(k in seen for k in keys):
                      return False
                  seen.update(keys)
          return True
      ```
- id: decode-ways
  input: 'Write `decode_ways(s: str) -> int`: the number of ways to decode a digit string where ''A''..''Z'' map to 1..26 (e.g. ''226'' -> 3: ''BZ'', ''VF'', ''BBF''). Leading zeros or invalid zeros make some or all decodings impossible (''06'' -> 0, ''10'' -> 1). The empty string has 1 way. Must be O(n).'
  tags:
  - coding
  vars:
    tests: |-
      assert decode_ways("12") == 2
      assert decode_ways("226") == 3
      assert decode_ways("06") == 0
      assert decode_ways("10") == 1
      assert decode_ways("100") == 0
      assert decode_ways("2101") == 1
      assert decode_ways("") == 1
      assert decode_ways("1" * 40) == 165580141
    reference: |-
      ```python
      def decode_ways(s):
          prev2, prev1 = 1, 1
          for i, ch in enumerate(s):
              cur = prev1 if ch != "0" else 0
              if i > 0 and (s[i - 1] == "1" or (s[i - 1] == "2" and ch <= "6")):
                  cur += prev2
              prev2, prev1 = prev1, cur
          return prev1
      ```
- id: render-table
  input: 'Write `render_table(headers: list[str], rows: list[list]) -> str` producing a plain-text table: each column padded to its widest cell (header included), cells separated by '' | '', a separator line of ''-'' under the header using ''-+-'' between columns, numbers (int/float) right-aligned and everything else left-aligned, no trailing spaces on any line, lines joined with ''\n''. Raise ValueError if a row has the wrong number of cells.'
  tags:
  - coding
  vars:
    tests: |-
      out = render_table(["name", "qty", "note"], [["apple", 3, "fresh"], ["kiwi", 12, ""]])
      assert out == "name  | qty | note\n------+-----+------\napple |   3 | fresh\nkiwi  |  12 |", repr(out)
      assert render_table(["a"], []) == "a\n-"
      try:
          render_table(["a", "b"], [[1]])
      except ValueError:
          pass
      else:
          raise AssertionError("ragged")
    reference: |-
      ```python
      def render_table(headers, rows):
          if any(len(r) != len(headers) for r in rows):
              raise ValueError("row length")
          cells = [[str(h) for h in headers]] + [[str(c) for c in r] for r in rows]
          widths = [max(len(row[i]) for row in cells) for i in range(len(headers))]
          def fmt(row, raw=None):
              parts = []
              for i, c in enumerate(row):
                  num = raw is not None and isinstance(raw[i], (int, float)) and not isinstance(raw[i], bool)
                  parts.append(c.rjust(widths[i]) if num else c.ljust(widths[i]))
              return " | ".join(parts).rstrip()
          lines = [fmt(cells[0]), "-+-".join("-" * w for w in widths)]
          lines += [fmt(c, r) for c, r in zip(cells[1:], rows)]
          return "\n".join(lines)
      ```
- id: cron-match
  input: 'Write `cron_matches(expr: str, dt: datetime) -> bool` for 5-field cron expressions ''minute hour day-of-month month day-of-week'' supporting ''*'', numbers, comma lists, ranges ''a-b'' and steps (''*/15'', ''10-50/20''). Day of week is 0-6 with 0 = Sunday (7 is also Sunday). Standard cron rule: if both day-of-month and day-of-week are restricted (not ''*''), the day matches when EITHER matches. Raise ValueError for malformed expressions or out-of-range values.'
  tags:
  - coding
  vars:
    tests: |-
      from datetime import datetime as DT
      assert cron_matches("*/15 * * * *", DT(2026, 3, 4, 10, 45))
      assert not cron_matches("*/15 * * * *", DT(2026, 3, 4, 10, 46))
      assert cron_matches("0 9-17/4 * * 1-5", DT(2026, 3, 4, 13, 0))
      assert not cron_matches("0 9-17/4 * * 1-5", DT(2026, 3, 7, 13, 0))
      assert cron_matches("30 2 1,15 * *", DT(2026, 6, 15, 2, 30))
      assert cron_matches("0 0 13 * 5", DT(2026, 3, 6, 0, 0))
      assert cron_matches("0 0 13 * 5", DT(2026, 4, 13, 0, 0))
      assert not cron_matches("0 0 13 * 5", DT(2026, 4, 14, 0, 0))
      assert cron_matches("0 12 * * 7", DT(2026, 3, 8, 12, 0))
      for bad in ("* * * *", "60 * * * *", "* 24 * * *", "* * 0 * *", "*/0 * * * *", "a * * * *", "5-1 * * * *"):
          try:
              cron_matches(bad, DT(2026, 1, 1))
          except ValueError:
              pass
          else:
              raise AssertionError(bad)
    reference: |-
      ```python
      def _field(spec, lo, hi):
          vals = set()
          for part in spec.split(","):
              rng, _, step = part.partition("/")
              step = int(step) if step else 1
              if step < 1:
                  raise ValueError(part)
              if rng == "*":
                  a, b = lo, hi
              elif "-" in rng:
                  a, b = (int(x) for x in rng.split("-"))
              else:
                  a = b = int(rng)
              if a > b or a < lo or b > hi:
                  raise ValueError(part)
              vals.update(range(a, b + 1, step))
          return vals
      def cron_matches(expr, dt):
          f = expr.split()
          if len(f) != 5:
              raise ValueError(expr)
          try:
              mins, hours = _field(f[0], 0, 59), _field(f[1], 0, 23)
              doms, months = _field(f[2], 1, 31), _field(f[3], 1, 12)
              dows = {d % 7 for d in _field(f[4], 0, 7)}
          except ValueError:
              raise ValueError(expr)
          dow = (dt.weekday() + 1) % 7
          dom_ok, dow_ok = dt.day in doms, dow in dows
          if f[2] != "*" and f[4] != "*":
              day_ok = dom_ok or dow_ok
          else:
              day_ok = dom_ok and dow_ok
          return dt.minute in mins and dt.hour in hours and dt.month in months and day_ok
      ```
- id: business-days
  input: 'Write `add_business_days(start: date, n: int, holidays: set[date]) -> date` returning the date n business days after start (Mon–Fri, excluding holidays). n may be negative (count backwards) or 0 (return start unchanged even if it is a weekend).'
  tags:
  - coding
  vars:
    tests: |-
      from datetime import date as Dt
      H = {Dt(2026, 12, 25), Dt(2026, 12, 28)}
      assert add_business_days(Dt(2026, 12, 24), 1, H) == Dt(2026, 12, 29)
      assert add_business_days(Dt(2026, 12, 29), -1, H) == Dt(2026, 12, 24)
      assert add_business_days(Dt(2026, 3, 6), 1, set()) == Dt(2026, 3, 9)
      assert add_business_days(Dt(2026, 3, 7), 0, set()) == Dt(2026, 3, 7)
      assert add_business_days(Dt(2026, 3, 7), 1, set()) == Dt(2026, 3, 9)
      assert add_business_days(Dt(2026, 3, 2), 10, set()) == Dt(2026, 3, 16)
    reference: |-
      ```python
      from datetime import timedelta
      def add_business_days(start, n, holidays):
          d, step, left = start, (1 if n >= 0 else -1), abs(n)
          while left:
              d += timedelta(days=step)
              if d.weekday() < 5 and d not in holidays:
                  left -= 1
          return d
      ```
- id: word-wrap-justify
  input: 'Write `justify(words: list[str], width: int) -> list[str]` fully justifying text: pack as many words per line as fit with at least one space between words; distribute extra spaces as evenly as possible, giving the leftmost gaps more; a line with one word and the last line are left-justified and padded with spaces to width.'
  tags:
  - coding
  vars:
    tests: |-
      assert justify(["This", "is", "an", "example", "of", "text", "justification."], 16) == ["This    is    an", "example  of text", "justification.  "]
      assert justify(["What", "must", "be", "acknowledgment", "shall", "be"], 16) == ["What   must   be", "acknowledgment  ", "shall be        "]
      assert justify(["a"], 3) == ["a  "]
    reference: |-
      ```python
      def justify(words, width):
          lines, cur = [], []
          for w in words:
              if cur and len(" ".join(cur + [w])) > width:
                  lines.append(cur)
                  cur = []
              cur.append(w)
          lines.append(cur)
          out = []
          for i, line in enumerate(lines):
              if i == len(lines) - 1 or len(line) == 1:
                  out.append(" ".join(line).ljust(width))
                  continue
              gaps = len(line) - 1
              spaces = width - sum(len(w) for w in line)
              q, r = divmod(spaces, gaps)
              s = ""
              for k, w in enumerate(line[:-1]):
                  s += w + " " * (q + (1 if k < r else 0))
              out.append(s + line[-1])
          return out
      ```
