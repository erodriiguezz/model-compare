- id: vigenere
  input: 'Write `vigenere(text: str, key: str, decrypt: bool = False) -> str`. Only ASCII letters are shifted (preserving case) by the key letters in turn (A/a = 0); other characters are copied and do not consume a key letter. The key is letters only, any case; raise ValueError for an empty or non-alphabetic key.'
  tags:
  - coding
  vars:
    tests: |-
      assert vigenere("ATTACK AT DAWN", "lemon") == "LXFOPV EF RNHR"
      assert vigenere("LXFOPV EF RNHR", "LEMON", decrypt=True) == "ATTACK AT DAWN"
      assert vigenere("Hello, World!", "key") == "Rijvs, Uyvjn!"
      assert vigenere(vigenere("Mixed Case 123", "Zz"), "Zz", True) == "Mixed Case 123"
      for bad in ("", "k3y"):
          try:
              vigenere("x", bad)
          except ValueError:
              pass
          else:
              raise AssertionError(bad)
    reference: |-
      ```python
      def vigenere(text, key, decrypt=False):
          if not key or not key.isascii() or not key.isalpha():
              raise ValueError(key)
          shifts = [ord(c) - 97 for c in key.lower()]
          out, k = [], 0
          for ch in text:
              if ch.isascii() and ch.isalpha():
                  base = 65 if ch.isupper() else 97
                  s = shifts[k % len(shifts)] * (-1 if decrypt else 1)
                  out.append(chr((ord(ch) - base + s) % 26 + base))
                  k += 1
              else:
                  out.append(ch)
          return "".join(out)
      ```
