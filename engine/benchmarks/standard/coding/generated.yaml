- id: next-permutation
  input: 'Write `next_permutation(xs: list) -> list` returning the next lexicographically greater permutation of xs as a new list, or the lowest (sorted ascending) permutation if xs is already the highest. Duplicates are allowed. Do not modify the input.'
  tags:
  - coding
  vars:
    tests: |-
      assert next_permutation([1, 2, 3]) == [1, 3, 2]
      assert next_permutation([3, 2, 1]) == [1, 2, 3]
      assert next_permutation([1, 1, 5]) == [1, 5, 1]
      assert next_permutation([1, 5, 1]) == [5, 1, 1]
      assert next_permutation([]) == []
      x = [2, 3, 1]
      assert next_permutation(x) == [3, 1, 2] and x == [2, 3, 1]
    reference: |-
      ```python
      def next_permutation(xs):
          a = list(xs)
          i = len(a) - 2
          while i >= 0 and a[i] >= a[i + 1]:
              i -= 1
          if i >= 0:
              j = len(a) - 1
              while a[j] <= a[i]:
                  j -= 1
              a[i], a[j] = a[j], a[i]
          a[i + 1:] = reversed(a[i + 1:])
          return a
      ```
- id: islands
  input: 'Write `count_islands(grid: list[str]) -> int` where each string is a row of ''1'' (land) and ''0'' (water). Land cells connect horizontally and vertically only. Must handle a 300x300 all-land grid without hitting the recursion limit.'
  tags:
  - coding
  vars:
    tests: |-
      assert count_islands(["11000", "11000", "00100", "00011"]) == 3
      assert count_islands([]) == 0
      assert count_islands(["0"]) == 0
      assert count_islands(["101", "010", "101"]) == 5
      assert count_islands(["1" * 300] * 300) == 1
    reference: |-
      ```python
      def count_islands(grid):
          if not grid:
              return 0
          h, w = len(grid), len(grid[0])
          seen = set()
          count = 0
          for r in range(h):
              for c in range(w):
                  if grid[r][c] == "1" and (r, c) not in seen:
                      count += 1
                      stack = [(r, c)]
                      seen.add((r, c))
                      while stack:
                          y, x = stack.pop()
                          for ny, nx in ((y + 1, x), (y - 1, x), (y, x + 1), (y, x - 1)):
                              if 0 <= ny < h and 0 <= nx < w and grid[ny][nx] == "1" and (ny, nx) not in seen:
                                  seen.add((ny, nx))
                                  stack.append((ny, nx))
          return count
      ```
- id: rpn
  input: 'Write `eval_rpn(tokens: list[str]) -> int` evaluating integer Reverse Polish Notation with + - * /. Division truncates toward zero (so ''-7 2 /'' is -3). Raise ValueError for malformed expressions (too few operands, leftover operands, unknown tokens) and ZeroDivisionError for division by zero.'
  tags:
  - coding
  vars:
    tests: |-
      assert eval_rpn(["2", "1", "+", "3", "*"]) == 9
      assert eval_rpn(["4", "13", "5", "/", "+"]) == 6
      assert eval_rpn(["-7", "2", "/"]) == -3
      assert eval_rpn(["7", "-2", "/"]) == -3
      assert eval_rpn(["42"]) == 42
      for bad in (["+"], ["1", "2"], ["1", "x", "+"], []):
          try:
              eval_rpn(bad)
          except ValueError:
              pass
          else:
              raise AssertionError(bad)
      try:
          eval_rpn(["1", "0", "/"])
      except ZeroDivisionError:
          pass
      else:
          raise AssertionError("div0")
    reference: |-
      ```python
      def eval_rpn(tokens):
          st = []
          for t in tokens:
              if t in ("+", "-", "*", "/"):
                  if len(st) < 2:
                      raise ValueError("operands")
                  b, a = st.pop(), st.pop()
                  if t == "+":
                      st.append(a + b)
                  elif t == "-":
                      st.append(a - b)
                  elif t == "*":
                      st.append(a * b)
                  else:
                      if b == 0:
                          raise ZeroDivisionError
                      q = abs(a) // abs(b)
                      st.append(q if (a >= 0) == (b >= 0) else -q)
              else:
                  try:
                      st.append(int(t))
                  except ValueError:
                      raise ValueError(t)
          if len(st) != 1:
              raise ValueError("leftover")
          return st[0]
      ```
- id: calc
  input: 'Write `calculate(expr: str) -> float` evaluating arithmetic with + - * /, parentheses, unary minus and decimal numbers, with normal precedence and left associativity. Do not use eval/exec. Raise ValueError for malformed input.'
  tags:
  - coding
  vars:
    tests: |-
      assert calculate("1 + 2 * 3") == 7
      assert calculate("(1 + 2) * 3") == 9
      assert calculate("10 / 4") == 2.5
      assert calculate("-3 + 5") == 2
      assert calculate("2 * -(1 + 1)") == -4
      assert calculate("8 - 3 - 2") == 3
      assert calculate("16 / 4 / 2") == 2
      assert calculate(" 1.5*2 ") == 3
      assert calculate("--2") == 2
      for bad in ("", "1 +", "(1 + 2", "1 2", "2 * * 3", "abc", "1 + 2)"):
          try:
              calculate(bad)
          except ValueError:
              pass
          else:
              raise AssertionError(bad)
    reference: |-
      ```python
      import re
      def calculate(expr):
          toks = re.findall(r"\d+\.?\d*|\.\d+|[-+*/()]|\S", expr)
          pos = 0
          def peek():
              return toks[pos] if pos < len(toks) else None
          def take():
              nonlocal pos
              pos += 1
              return toks[pos - 1]
          def expr_():
              v = term()
              while peek() in ("+", "-"):
                  v = v + term() if take() == "+" else v - term()
              return v
          def term():
              v = factor()
              while peek() in ("*", "/"):
                  v = v * factor() if take() == "*" else v / factor()
              return v
          def factor():
              t = peek()
              if t is None:
                  raise ValueError("end")
              if t == "-":
                  take()
                  return -factor()
              if t == "+":
                  take()
                  return factor()
              if t == "(":
                  take()
                  v = expr_()
                  if peek() != ")":
                      raise ValueError(")")
                  take()
                  return v
              if re.fullmatch(r"\d+\.?\d*|\.\d+", t):
                  take()
                  return float(t)
              raise ValueError(t)
          v = expr_()
          if pos != len(toks):
              raise ValueError("trailing")
          return v
      ```
