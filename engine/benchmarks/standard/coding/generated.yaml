      out = deep_merge(a, b)
      assert out == {"x": 1, "y": 2, "n": {"p": 1, "q": {"r": 1, "s": 2}, "t": 3}, "l": [2]}
      assert a == {"x": 1, "n": {"p": 1, "q": {"r": 1}}, "l": [1]}
