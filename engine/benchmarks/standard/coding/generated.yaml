- id: parse-duration
  input: 'Write `parse_duration(s: str) -> int` returning seconds for strings like ''1h30m'', ''2d'', ''45s'', ''1d2h3m4s''. Units are d, h, m, s, must appear in that order, each at most once, with a positive or zero integer before each. Raise ValueError for anything else (empty string, unknown unit, wrong order, repeated unit, missing number, spaces).'
  tags:
  - coding
  vars:
    tests: |-
      assert parse_duration("1h30m") == 5400
      assert parse_duration("2d") == 172800
      assert parse_duration("1d2h3m4s") == 93784
      assert parse_duration("0s") == 0
      assert parse_duration("90m") == 5400
      for bad in ["", "1x", "30m1h", "1h1h", "h", "1 h", "-1s", "1.5h"]:
          try:
              parse_duration(bad)
          except ValueError:
              pass
          else:
              raise AssertionError(bad)
    reference: |-
      ```python
      import re
      def parse_duration(s):
          m = re.fullmatch(r"(?:(\d+)d)?(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?", s)
          if not s or not m:
              raise ValueError(s)
          d, h, mi, se = (int(x) if x else 0 for x in m.groups())
          return d * 86400 + h * 3600 + mi * 60 + se
      ```
- id: semver-compare
  input: 'Write `semver_compare(a: str, b: str) -> int` returning -1, 0 or 1 following Semantic Versioning 2.0.0 precedence, including pre-release identifiers (e.g. 1.0.0-alpha < 1.0.0-alpha.1 < 1.0.0-alpha.beta < 1.0.0-beta.2 < 1.0.0-beta.11 < 1.0.0-rc.1 < 1.0.0). Build metadata after ''+'' is ignored.'
  tags:
  - coding
  vars:
    tests: |-
      order = ["1.0.0-alpha", "1.0.0-alpha.1", "1.0.0-alpha.beta", "1.0.0-beta", "1.0.0-beta.2", "1.0.0-beta.11", "1.0.0-rc.1", "1.0.0", "1.0.1", "1.10.0", "2.0.0"]
      for i in range(len(order) - 1):
          assert semver_compare(order[i], order[i + 1]) == -1, order[i]
          assert semver_compare(order[i + 1], order[i]) == 1
      assert semver_compare("1.0.0+build.1", "1.0.0+build.2") == 0
      assert semver_compare("1.2.3", "1.2.3") == 0
    reference: |-
      ```python
      def semver_compare(a, b):
          def key(v):
              v = v.split("+")[0]
              core, _, pre = v.partition("-")
              nums = tuple(int(x) for x in core.split("."))
              if not pre:
                  return nums, (1,)
              ids = tuple((0, int(p), "") if p.isdigit() else (1, 0, p) for p in pre.split("."))
              return nums, (0, ids)
          ka, kb = key(a), key(b)
          if ka[0] != kb[0]:
              return -1 if ka[0] < kb[0] else 1
          pa, pb = ka[1], kb[1]
          if pa == pb:
              return 0
          if pa[0] != pb[0]:
              return -1 if pa[0] < pb[0] else 1
          return -1 if pa[1] < pb[1] else 1
      ```
- id: lru-cache
  input: 'Write a class `LRUCache(capacity: int)` with `get(key) -> value or -1` and `put(key, value)`. Both operations count as a use. When full, `put` of a new key evicts the least recently used key. Updating an existing key''s value does not evict anything.'
  tags:
  - coding
  vars:
    tests: |-
      c = LRUCache(2)
      c.put(1, 1); c.put(2, 2)
      assert c.get(1) == 1
      c.put(3, 3)
      assert c.get(2) == -1
      c.put(1, 10)
      c.put(4, 4)
      assert c.get(3) == -1 and c.get(1) == 10 and c.get(4) == 4
      c1 = LRUCache(1)
      c1.put("a", 1); c1.put("a", 2)
      assert c1.get("a") == 2
    reference: |-
      ```python
      from collections import OrderedDict
      class LRUCache:
          def __init__(self, capacity):
              self.capacity, self.d = capacity, OrderedDict()
          def get(self, key):
              if key not in self.d:
                  return -1
              self.d.move_to_end(key)
              return self.d[key]
          def put(self, key, value):
              if key in self.d:
                  self.d.move_to_end(key)
              self.d[key] = value
              if len(self.d) > self.capacity:
                  self.d.popitem(last=False)
      ```
- id: topo-sort
  input: 'Write `topo_sort(deps: dict[str, list[str]]) -> list[str]` where deps[x] lists the nodes x depends on (which must come before x). Nodes that only appear as dependencies are included too. When several nodes are ready, take them in alphabetical order. Raise ValueError if there is a cycle.'
  tags:
  - coding
  vars:
    tests: |-
      assert topo_sort({"b": ["a"], "c": ["a", "b"], "a": []}) == ["a", "b", "c"]
      assert topo_sort({"z": [], "y": [], "x": ["z"]}) == ["y", "z", "x"]
      assert topo_sort({"app": ["lib", "log"], "lib": ["log"]}) == ["log", "lib", "app"]
      assert topo_sort({}) == []
      for cyc in ({"a": ["b"], "b": ["a"]}, {"a": ["a"]}, {"a": ["b"], "b": ["c"], "c": ["a"]}):
          try:
              topo_sort(cyc)
          except ValueError:
              pass
          else:
              raise AssertionError(cyc)
    reference: |-
      ```python
      import heapq
      def topo_sort(deps):
          nodes = set(deps) | {d for ds in deps.values() for d in ds}
          indeg = {n: 0 for n in nodes}
          users = {n: [] for n in nodes}
          for n, ds in deps.items():
              for d in set(ds):
                  indeg[n] += 1
                  users[d].append(n)
          ready = [n for n in nodes if indeg[n] == 0]
          heapq.heapify(ready)
          out = []
          while ready:
              n = heapq.heappop(ready)
              out.append(n)
              for u in users[n]:
                  indeg[u] -= 1
                  if indeg[u] == 0:
                      heapq.heappush(ready, u)
          if len(out) != len(nodes):
              raise ValueError("cycle")
          return out
      ```
- id: json-pointer
  input: 'Write `resolve_pointer(doc, pointer: str)` implementing RFC 6901 JSON Pointer lookup: '''' is the whole document, tokens are separated by ''/'', ''~1'' means ''/'', ''~0'' means ''~'', list indices are decimal without leading zeros. Raise KeyError if the path does not exist (including out-of-range or malformed indices).'
  tags:
  - coding
  vars:
    tests: |-
      doc = {"foo": ["bar", "baz"], "": 0, "a/b": 1, "m~n": 8, "k": {"0": "zero", "list": [{"x": 1}]}}
      assert resolve_pointer(doc, "") == doc
      assert resolve_pointer(doc, "/foo/1") == "baz"
      assert resolve_pointer(doc, "/") == 0
      assert resolve_pointer(doc, "/a~1b") == 1
      assert resolve_pointer(doc, "/m~0n") == 8
      assert resolve_pointer(doc, "/k/0") == "zero"
      assert resolve_pointer(doc, "/k/list/0/x") == 1
      for bad in ["/foo/2", "/foo/01", "/foo/-1", "/nope", "/foo/x", "/k/list/0/x/y"]:
          try:
              resolve_pointer(doc, bad)
          except KeyError:
              pass
          else:
              raise AssertionError(bad)
    reference: |-
      ```python
      def resolve_pointer(doc, pointer):
          if pointer == "":
              return doc
          if not pointer.startswith("/"):
              raise KeyError(pointer)
          cur = doc
          for tok in pointer[1:].split("/"):
              tok = tok.replace("~1", "/").replace("~0", "~")
              if isinstance(cur, list):
                  if not tok.isdigit() or (len(tok) > 1 and tok[0] == "0") or int(tok) >= len(cur):
                      raise KeyError(tok)
                  cur = cur[int(tok)]
              elif isinstance(cur, dict):
                  if tok not in cur:
                      raise KeyError(tok)
                  cur = cur[tok]
              else:
                  raise KeyError(tok)
          return cur
      ```
