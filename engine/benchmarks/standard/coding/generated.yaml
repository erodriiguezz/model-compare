      assert a["n"]["q"]["r"] == 1
      assert deep_merge({"k": {"a": 1}}, {"k": 5}) == {"k": 5}
    reference: |-
      ```python
      import copy
      def deep_merge(a, b):
          out = copy.deepcopy(a)
          for k, v in b.items():
              if isinstance(out.get(k), dict) and isinstance(v, dict):
                  out[k] = deep_merge(out[k], v)
              else:
                  out[k] = copy.deepcopy(v)
          return out
      ```
- id: flatten-dict
  input: 'Write `flatten_dict(d: dict, sep: str = ''.'') -> dict` turning nested dicts into a single level with joined keys ({''a'': {''b'': 1}} -> {''a.b'': 1}). An empty nested dict is kept as a value ({''a'': {}} -> {''a'': {}}). Lists are values, not nested.'
  tags:
