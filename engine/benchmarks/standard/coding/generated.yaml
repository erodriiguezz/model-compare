- id: running-median
  input: 'Write a class `RunningMedian` with `add(x: float)` and `median() -> float`. median() of an even count is the mean of the two middle values; calling median() with no values raises ValueError. Both operations must be O(log n).'
  tags:
  - coding
  vars:
    tests: |-
      rm = RunningMedian()
      try:
          rm.median()
      except ValueError:
          pass
      else:
          raise AssertionError("empty")
      for x, m in [(5, 5), (15, 10), (1, 5), (3, 4), (8, 5), (7, 6), (9, 7)]:
          rm.add(x)
          assert rm.median() == m, (x, rm.median())
      big = RunningMedian()
      for i in range(100000):
          big.add(i % 1000)
      assert big.median() == 499.5
    reference: |-
      ```python
      import heapq
      class RunningMedian:
          def __init__(self):
              self.lo, self.hi = [], []
          def add(self, x):
              heapq.heappush(self.lo, -x)
              heapq.heappush(self.hi, -heapq.heappop(self.lo))
              if len(self.hi) > len(self.lo):
                  heapq.heappush(self.lo, -heapq.heappop(self.hi))
          def median(self):
              if not self.lo:
                  raise ValueError("empty")
              if len(self.lo) > len(self.hi):
                  return float(-self.lo[0])
              return (-self.lo[0] + self.hi[0]) / 2
      ```
- id: base-convert
  input: 'Write `convert_base(s: str, from_base: int, to_base: int) -> str` for bases 2..36 using digits 0-9 then lowercase a-z. Input may be uppercase and may start with ''-''. Output is lowercase with no leading zeros (''0'' for zero). Raise ValueError for an invalid base or a digit not valid in from_base.'
  tags:
  - coding
  vars:
    tests: |-
      assert convert_base("ff", 16, 10) == "255"
      assert convert_base("FF", 16, 2) == "11111111"
      assert convert_base("-101", 2, 10) == "-5"
      assert convert_base("0", 10, 36) == "0"
      assert convert_base("zz", 36, 10) == "1295"
      assert convert_base("000123", 10, 10) == "123"
      for args in (("12", 2, 10), ("1", 1, 10), ("1", 10, 37), ("", 10, 2), ("-", 10, 2)):
          try:
              convert_base(*args)
          except ValueError:
              pass
          else:
              raise AssertionError(args)
    reference: |-
      ```python
      DIG = "0123456789abcdefghijklmnopqrstuvwxyz"
      def convert_base(s, from_base, to_base):
          if not (2 <= from_base <= 36 and 2 <= to_base <= 36):
              raise ValueError("base")
          neg = s.startswith("-")
          body = s[1:] if neg else s
          if not body:
              raise ValueError("empty")
          n = 0
          for ch in body.lower():
              v = DIG.find(ch)
              if v < 0 or v >= from_base:
                  raise ValueError(ch)
              n = n * from_base + v
          if n == 0:
              return "0"
          out = ""
          while n:
              n, r = divmod(n, to_base)
              out = DIG[r] + out
          return ("-" if neg else "") + out
      ```
- id: csv-line
  input: 'Write `parse_csv_line(line: str) -> list[str]` without using the csv module. Fields are comma-separated; a field may be wrapped in double quotes, inside which commas are literal and a doubled quote ''""'' means one quote. Unquoted fields are returned as-is (no stripping). An empty line is one empty field. Raise ValueError for an unterminated quoted field.'
  tags:
  - coding
  vars:
    tests: |-
      assert parse_csv_line('a,b,c') == ["a", "b", "c"]
      assert parse_csv_line('"a,b",c') == ["a,b", "c"]
      assert parse_csv_line('"say ""hi""",x') == ['say "hi"', "x"]
      assert parse_csv_line('a,,') == ["a", "", ""]
      assert parse_csv_line('') == [""]
      assert parse_csv_line(' a , b') == [" a ", " b"]
      assert parse_csv_line('"",x') == ["", "x"]
      try:
          parse_csv_line('"abc,d')
      except ValueError:
          pass
      else:
          raise AssertionError("unterminated")
    reference: |-
      ```python
      def parse_csv_line(line):
          out, i, n = [], 0, len(line)
          while True:
              if i < n and line[i] == '"':
                  i += 1
                  buf = ""
                  while True:
                      if i >= n:
                          raise ValueError("unterminated")
                      if line[i] == '"':
                          if i + 1 < n and line[i + 1] == '"':
                              buf += '"'
                              i += 2
                              continue
                          i += 1
                          break
                      buf += line[i]
                      i += 1
                  out.append(buf)
              else:
                  j = line.find(",", i)
                  j = n if j < 0 else j
                  out.append(line[i:j])
                  i = j
              if i >= n:
                  return out
              i += 1
              if i == n:
                  out.append("")
                  return out
      ```
- id: dijkstra
  input: 'Write `shortest_paths(graph: dict[str, list[tuple[str, float]]], source: str) -> dict[str, float]` returning the shortest distance from source to every reachable node (source itself is 0). Edges are directed with non-negative weights. Nodes may appear only as edge targets.'
  tags:
  - coding
  vars:
    tests: |-
      g = {"a": [("b", 7), ("c", 9), ("f", 14)], "b": [("c", 10), ("d", 15)], "c": [("d", 11), ("f", 2)], "d": [("e", 6)], "f": [("e", 9)], "x": [("a", 1)]}
      assert shortest_paths(g, "a") == {"a": 0, "b": 7, "c": 9, "d": 20, "e": 20, "f": 11}
      assert shortest_paths(g, "e") == {"e": 0}
      assert shortest_paths({"s": [("t", 0)]}, "s") == {"s": 0, "t": 0}
    reference: |-
      ```python
      import heapq
      def shortest_paths(graph, source):
          dist = {source: 0}
          pq = [(0, source)]
          while pq:
              d, u = heapq.heappop(pq)
              if d > dist.get(u, float("inf")):
                  continue
              for v, w in graph.get(u, []):
                  nd = d + w
                  if nd < dist.get(v, float("inf")):
                      dist[v] = nd
                      heapq.heappush(pq, (nd, v))
          return dist
      ```
