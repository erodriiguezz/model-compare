      assert normalize_path("../../a") == "../../a"
    reference: |-
      ```python
      def normalize_path(p):
          absolute = p.startswith("/")
          out = []
          for seg in p.split("/"):
              if seg in ("", "."):
                  continue
              if seg == "..":
                  if out and out[-1] != "..":
                      out.pop()
                  elif not absolute:
                      out.append("..")
              else:
                  out.append(seg)
          s = "/".join(out)
          return "/" + s if absolute else (s or ".")
      ```
