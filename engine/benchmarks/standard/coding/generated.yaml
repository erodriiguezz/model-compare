      def format_bytes(n):
          if n < 0:
              raise ValueError(n)
          if n < 1024:
              return f"{n} B"
          units = ["KiB", "MiB", "GiB", "TiB"]
          v, i = n / 1024, 0
          while v >= 1024 and i < len(units) - 1:
              v /= 1024
              i += 1
          return f"{v:.1f} {units[i]}"
      ```
- id: query-string
  input: 'Write `parse_query(qs: str) -> dict[str, list[str]]` parsing a URL query string (without the leading ''?''). Pairs are separated by ''&''; a key without ''='' has value ''''; ''+'' means space; %XX escapes are decoded as UTF-8 in both keys and values; repeated keys collect values in order; empty pairs are skipped. Do not use urllib.parse.'
  tags:
  - coding
  vars:
    tests: |-
      assert parse_query("a=1&b=2&a=3&c") == {"a": ["1", "3"], "b": ["2"], "c": [""]}
      assert parse_query("q=hello+world&x=%E2%9C%93") == {"q": ["hello world"], "x": ["✓"]}
      assert parse_query("") == {}
      assert parse_query("&&k=v&") == {"k": ["v"]}
      assert parse_query("a%20b=c%3Dd") == {"a b": ["c=d"]}
      assert parse_query("e=") == {"e": [""]}
    reference: |-
      ```python
      import re
      def _dec(s):
          s = s.replace("+", " ")
          return re.sub(r"(?:%[0-9A-Fa-f]{2})+", lambda m: bytes.fromhex(m.group().replace("%", "")).decode("utf-8"), s)
      def parse_query(qs):
          out = {}
          for pair in qs.split("&"):
              if not pair:
                  continue
              k, _, v = pair.partition("=")
              out.setdefault(_dec(k), []).append(_dec(v))
          return out
      ```
