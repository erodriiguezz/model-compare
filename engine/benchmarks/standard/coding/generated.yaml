      assert not luhn_valid(" 0 ")
      assert not luhn_valid("055-444-285")
      assert luhn_valid("0000 0")
    reference: |-
      ```python
      def luhn_valid(number):
          s = number.replace(" ", "")
          if len(s) < 2 or not s.isdigit():
              return False
          total = 0
          for i, ch in enumerate(reversed(s)):
              d = int(ch)
              if i % 2:
                  d *= 2
                  if d > 9:
                      d -= 9
              total += d
          return total % 10 == 0
      ```
