      assert expand_ranges("1-3,5,7-9") == [1, 2, 3, 5, 7, 8, 9]
      assert expand_ranges(" 4 , 2-3 ,3") == [2, 3, 4]
      assert expand_ranges("7") == [7]
      assert expand_ranges("10-10") == [10]
      for bad in ("5-3", "1,,2", "", "a-b", "1-", "1-2-3"):
          try:
              expand_ranges(bad)
          except ValueError:
              pass
          else:
              raise AssertionError(bad)
    reference: |-
      ```python
      def expand_ranges(spec):
          out = set()
          for item in spec.split(","):
              item = item.strip()
              if not item:
                  raise ValueError("empty")
              parts = item.split("-")
              if len(parts) == 1:
                  out.add(int(parts[0]))
              elif len(parts) == 2:
                  a, b = int(parts[0]), int(parts[1])
                  if a > b:
                      raise ValueError(item)
                  out.update(range(a, b + 1))
              else:
                  raise ValueError(item)
          return sorted(out)
      ```
- id: compress-ranges
  input: 'Write `compress_ranges(nums: list[int]) -> str`, the inverse of range expansion: sort and dedupe, then join runs of consecutive integers as ''a-b'' (runs of exactly two are written ''a,b''), separated by commas. Negative numbers are allowed; an empty list gives ''''.'
  tags:
  - coding
  vars:
    tests: |-
      assert compress_ranges([1, 2, 3, 5, 7, 8, 9]) == "1-3,5,7-9"
      assert compress_ranges([3, 1, 2, 2]) == "1-3"
      assert compress_ranges([4, 5]) == "4,5"
      assert compress_ranges([]) == ""
      assert compress_ranges([-3, -2, -1, 1]) == "-3--1,1"
    reference: |-
      ```python
      def compress_ranges(nums):
          s = sorted(set(nums))
          out, i = [], 0
          while i < len(s):
              j = i
              while j + 1 < len(s) and s[j + 1] == s[j] + 1:
                  j += 1
              if j - i >= 2:
                  out.append(f"{s[i]}-{s[j]}")
              else:
                  out.extend(str(x) for x in s[i:j + 1])
              i = j + 1
          return ",".join(out)
      ```
