    reference: |-
      ```python
      def flatten_dict(d, sep="."):
          out = {}
          def walk(prefix, v):
              if isinstance(v, dict) and v:
                  for k, x in v.items():
                      walk(f"{prefix}{sep}{k}" if prefix else str(k), x)
              else:
                  out[prefix] = v
          for k, v in d.items():
              walk(str(k), v)
          return out
      ```
