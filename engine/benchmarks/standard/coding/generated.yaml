  input: 'Write `unflatten_dict(d: dict, sep: str = ''.'') -> dict`, the inverse of flattening ({''a.b'': 1, ''a.c'': 2} -> {''a'': {''b'': 1, ''c'': 2}}). Raise ValueError when keys conflict (e.g. both ''a'' and ''a.b'' with ''a'' not a dict).'
  tags:
  - coding
  vars:
    tests: |-
      assert unflatten_dict({"a.b": 1, "a.c.d": 2, "e": 3}) == {"a": {"b": 1, "c": {"d": 2}}, "e": 3}
      assert unflatten_dict({"a/b": 1}, sep="/") == {"a": {"b": 1}}
      assert unflatten_dict({}) == {}
      for bad in ({"a": 1, "a.b": 2}, {"a.b": 2, "a": 1}):
