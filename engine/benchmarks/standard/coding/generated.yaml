- id: window-max
  input: 'Write `window_max(nums: list[int], k: int) -> list[int]` returning the maximum of every contiguous window of size k, in O(n). Raise ValueError if k < 1 or k > len(nums).'
  tags:
  - coding
  vars:
    tests: |-
      assert window_max([1, 3, -1, -3, 5, 3, 6, 7], 3) == [3, 3, 5, 5, 6, 7]
      assert window_max([4], 1) == [4]
      assert window_max([9, 8, 7, 6], 2) == [9, 8, 7]
      assert window_max([2, 2, 2], 3) == [2]
      for k in (0, 5):
          try:
              window_max([1, 2, 3, 4], k)
          except ValueError:
              pass
          else:
              raise AssertionError(k)
      import time
      t = time.time()
      window_max(list(range(200000)), 1000)
      assert time.time() - t < 2
    reference: |-
      ```python
      from collections import deque
      def window_max(nums, k):
          if k < 1 or k > len(nums):
              raise ValueError(k)
          dq, out = deque(), []
          for i, x in enumerate(nums):
              while dq and nums[dq[-1]] <= x:
                  dq.pop()
              dq.append(i)
              if dq[0] <= i - k:
                  dq.popleft()
              if i >= k - 1:
                  out.append(nums[dq[0]])
          return out
      ```
