    from decimal import ROUND_HALF_UP, Decimal

    CENT = Decimal("0.01")
    COUPONS = {"SAVE10": ("percent", Decimal("10")), "FIVEOFF": ("fixed", Decimal("5.00"))}


    def to_cents(x: Decimal) -> Decimal:
        return x.quantize(CENT, rounding=ROUND_HALF_UP)


    @dataclass
