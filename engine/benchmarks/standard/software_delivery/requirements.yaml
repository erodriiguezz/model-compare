- id: requirements-cart-gift-cards
  input: |-
    Product request for the team that owns a shopping-cart pricing module: "Customers should be able to pay part of an order with a gift card."

    Write the acceptance criteria an engineer and QA would work from. Cover the main behaviour, edge cases and failure cases, and list open questions for anything the request leaves ambiguous. Respond with only JSON: {"acceptance_criteria": [{"id": "AC-1", "given": ..., "when": ..., "then": ...}], "open_questions": [...]}.
  tags:
  - requirements
  - cart
  scorers:
  - type: json_schema
    weight: 1
  - type: llm_judge
    weight: 3
    params:
      rubric: |-
        Score how well the acceptance criteria would let an engineer build and test this feature. Award points for each of these being covered by a specific, testable criterion or open question:
        - partial and full payment with a gift card balance
        - gift card cannot reduce the total below zero / leftover balance is kept
        - tax is computed before the gift card is applied
        - invalid, expired or already-used cards are rejected with a clear message
        - an open question about combining gift cards with coupons or multiple gift cards
        Deduct for vague criteria (e.g. 'works correctly'), implementation details instead of behaviour, or contradictions. 10 = all covered precisely; 5 = about half; 1 = unusable.
  vars:
    schema: &id001
      type: object
      required:
      - acceptance_criteria
      - open_questions
      properties:
        acceptance_criteria:
          type: array
          minItems: 3
          items:
            type: object
            required:
            - id
            - given
            - when
            - then
            properties:
              id:
                type: string
              given:
                type: string
              when:
                type: string
              then:
                type: string
        open_questions:
          type: array
          items:
            type: string
    reference: '{"acceptance_criteria": [{"id": "AC-1", "given": "context", "when": "action", "then": "partial and full payment with a gift card balance"}, {"id": "AC-2", "given": "context", "when": "action", "then": "gift card cannot reduce the total below zero / leftover balance is kept"}, {"id": "AC-3", "given": "context", "when": "action", "then": "tax is computed before the gift card is applied"}, {"id": "AC-4", "given": "context", "when": "action", "then": "invalid, expired or already-used cards are rejected with a clear message"}], "open_questions": ["an open question about combining gift cards with coupons or multiple gift cards"]}'
