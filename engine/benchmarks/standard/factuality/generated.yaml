name: std-grounded-answers
version: '1.0'
dimension: factuality
source: standard
description: Questions about invented documents (prior knowledge can't help); 30% are not answered by the document and must be declined.
system_prompt: 'Answer the question using only the document above. If the document does not contain the answer, reply exactly `ANSWER: NOT IN DOCUMENT`. Otherwise give just the value — a number without units, a name, yes/no, or a date as YYYY-MM-DD — on a final line of the form `ANSWER: <value>`.'
documents:
  product_policy: |-
    VELTRA HOME AIR — CUSTOMER POLICY (rev. June 2026)

    Veltra sells two purifiers: the Veltra Lite and the Veltra Pro. The Veltra Lite may be returned within 41 days of delivery; the Veltra Pro within 34 days. Returns of opened units carry a restocking fee of 12 euros, waived for defective units.
    The Lite carries a 5-year limited warranty and the Pro a 1-year limited warranty, both covering the motor and sensors but not filters. Replacement filters are sold separately.
    Both models launched in the EU on 25 June 2026. Escalations go to the head of customer care, Odile Marchetti.
    Units bought from unauthorised resellers are not covered by this policy.
  travel_policy: |-
    NORTHWIND ROBOTICS — BUSINESS TRAVEL POLICY

    Hotel stays are reimbursed up to 260 US dollars per night, or up to 300 dollars per night in designated high-cost cities (currently New York, London, Zurich and Tokyo). The meal per diem is 45 dollars per day regardless of city.
    International flights must be booked at least 28 days before departure; exceptions require approval by the CFO.
    Employees should take the train instead of flying for any journey under 5 hours by rail.
    Business class is permitted only on flights longer than 9 hours.
  lab_protocol: |-
    PROTOCOL QX-7 — SAMPLE PREPARATION (owner: Dr. Ramona Iordache)

    1. Thaw samples at 18 °C. Do not refreeze.
    2. Mix buffer and sample at a 3:1 ratio (buffer:sample).
    3. Centrifuge at 3000 rpm for 20 minutes. If the pellet is not visible, repeat once at the same settings.
    4. Discard any sample stored for more than 48 hours after thawing.
    5. Record lot numbers in the lab notebook before step 3.
  sla: |-
    CIRRUSDB MANAGED SERVICE — SERVICE LEVEL AGREEMENT

    CirrusDB commits to 99.9% monthly uptime for production clusters. Development clusters carry no uptime commitment.
    If monthly uptime falls below the commitment, the customer receives a service credit of 15% of that month's fee; below 99.0% the credit is 25%.
    Priority 1 incidents receive a first response within 15 minutes, 24/7. Priority 2 incidents receive a first response within 12 business hours.
    Credits must be claimed within 45 days of the end of the affected month.
  ordinance: |-
    CITY OF ALDERMOOR — NOISE ORDINANCE No. 678

    This ordinance takes effect on 15 September 2026. Quiet hours run from 23:00 to 6:00 every day.
    A first violation carries a fine of 600 crowns; any repeat violation within twelve months carries a fine of 200 crowns.
    Construction outside permitted hours requires a permit requested at least 20 working days in advance.
    Emergency repairs by utilities are exempt.
  onboarding: |-
    PELICAN LABS — NEW STARTER GUIDE

    Laptops are shipped to arrive 2 working days before your start date. Every new starter is paired with a buddy for their first 4 weeks. Your first formal check-in with your manager happens on day 30.
    A one-off home-office stipend of 600 euros is paid with your first salary. For anything about onboarding, contact Aiko Shimizu in People Ops.
